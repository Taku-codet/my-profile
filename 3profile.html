<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bg-gray-50 py-8>
    <header class="fixed top-0 left-0 w-full bg-white z-50 flex items-center justify-between px-6 py-4 ">
        <a href="./index.html">
    <img src="./logo.png" alt="サイトロゴ" class="h-8">
        </a>
    </header>
    <main class="max-w-4xl mx-auto px-4 mt-16">
      <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">よしなにグループ（仮）</h1>
      <div class="flex flex-col md:flex-row gap-6">
        <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
          <span class="text-4xl">🌵</span>
          <h2 class="text-lg font-bold text-gray-900 mt-3">松田 宗橙</h2>
          <p class="text-gray-600 text-sm mt-2 text-center">観る専、海鮮好き、少し真面目</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
          <span class="text-4xl">💻</span>
          <h2 class="text-lg font-bold text-gray-900 mt-3">山根 拓己</h2>
          <p class="text-gray-600 text-sm mt-2 text-center">ゲーム好き、柔道など武道したい。</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
          <span class="text-4xl">👹</span>
          <h2 class="text-lg font-bold text-gray-900 mt-3">瀬川 洋輔</h2>
          <p class="text-gray-600 text-sm mt-2 text-center">ファンパレ好き、マイペース。</p>
        </div>
      </div>
