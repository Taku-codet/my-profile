<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week06 BMI計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-6">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-sm w-full mx-auto bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">BMI計算ツール</h1>

            <div class="mb-4">
                <label for="weight" class="block text-sm text-gray-500 mb-1">体重（Kg）</label>
                <input type="number" id="weight" min="0" placeholder="例: 60"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div class="mb-6">
                <label for="height" class="block text-sm text-gray-500 mb-1">身長（cm）</label>
                <input type="number" id="height" min="0" placeholder="例: 160"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <button id="calc-btn"
                class="bg-blue-600 text-white w-full py-2 rounded-lg font-semibold hover:bg-blue-700">計算する</button>

            <div id="result" class="mt-6 text-3xl font-bold text-center text-gray-900 min-h-[2.5rem]"></div>
        </div>
    </div>
    <script>
        const button = document.querySelector("#calc-btn");
        const result = document.querySelector("#result");

        function calcBmi(heightCm, weight) {
          const heightM = heightCm / 100;
          return weight / (heightM * heightM);
        }

        function getJudgment(bmi) {
          if (bmi < 18.5) {
            return "痩せ型";
          } else if (bmi < 25) {
            return "普通";
          } else {
            return "肥満";
          }
        }

        button.addEventListener("click", () => {
          const heightCm = Number(document.querySelector("#height").value);
          const weight = Number(document.querySelector("#weight").value);

          // 未入力・0以下・数値でない場合をまとめて弾く
          if (!heightCm || !weight || heightCm <= 0 || weight <= 0) {
            result.textContent = "身長(cm)と体重(kg)に1以上の数値を入力してください";
            return;
          }

          const bmi = calcBmi(heightCm, weight);
          const judgment = getJudgment(bmi);

          result.textContent = "BMI: " + bmi.toFixed(1) + "（" + judgment + "）";
        });
    </script>
</body>
</html>
