<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub ユーザー検索</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-md mx-auto">
      <h1 class="text-2xl font-bold mb-6">GitHub ユーザー検索</h1>

      <!-- 入力フォーム -->
      <div class="flex gap-2 mb-6">
        <input
          id="usernameInput"
          type="text"
          placeholder="例: torvalds"
          class="flex-1 rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          id="searchButton"
          class="rounded-lg bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-700 disabled:opacity-50"
        >
          検索
        </button>
      </div>

      <!-- 結果表示エリア -->
      <div id="result"></div>
    </div>

    <script>
      const input = document.getElementById("usernameInput");
      const button = document.getElementById("searchButton");
      const result = document.getElementById("result");

      async function searchUser() {
        const username = input.value.trim();
        if (!username) {
          result.innerHTML =
            '<p class="text-gray-600">ユーザー名を入力してください。</p>';
          return;
        }

        // 【発展】ローディング表示
        button.disabled = true;
        result.innerHTML = '<p class="text-gray-600">読み込み中...</p>';

        try {
          const response = await fetch(
            `https://api.github.com/users/${username}`
          );

          // 通信の成功を確認（存在しないユーザーは 404 で ok が false になる）
          if (!response.ok) {
            result.innerHTML =
              '<p class="text-red-600 font-bold">ユーザーが見つかりませんでした</p>';
            return;
          }

          const user = await response.json();

          // Consoleでデータ構造を確認（どのプロパティを使うか決めるため）
          console.log(user);

          // 取得したデータをカードに表示
          result.innerHTML = `
            <div class="bg-white rounded-lg shadow p-6 text-center">
              <img
                src="${user.avatar_url}"
                alt="${user.login} のアバター"
                class="w-24 h-24 rounded-full mx-auto mb-4"
              />
              <h2 class="text-xl font-bold">${user.name ?? user.login}</h2>
              <p class="text-gray-600 mt-2">${user.bio ?? "（自己紹介はありません）"}</p>

              <div class="flex justify-center gap-6 mt-4 text-sm">
                <div>
                  <span class="block font-bold text-lg">${user.followers}</span>
                  <span class="text-gray-500">フォロワー</span>
                </div>
                <div>
                  <span class="block font-bold text-lg">${user.public_repos}</span>
                  <span class="text-gray-500">リポジトリ</span>
                </div>
              </div>

              <a
                href="${user.html_url}"
                target="_blank"
                rel="noopener"
                class="inline-block mt-4 text-blue-600 hover:underline"
              >
                プロフィールを開く →
              </a>
            </div>
          `;
        } catch (error) {
          // ネットワークエラーなど（fetch自体が失敗した場合）
          console.error(error);
          result.innerHTML =
            '<p class="text-red-600">通信エラーが発生しました。時間をおいて再度お試しください。</p>';
        } finally {
          // 成功・失敗にかかわらずボタンを再有効化
          button.disabled = false;
        }
      }

      // ボタンクリックで検索
      button.addEventListener("click", searchUser);

      // Enterキーでも検索できるように
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") searchUser();
      });
    </script>
  </body>
</html>
